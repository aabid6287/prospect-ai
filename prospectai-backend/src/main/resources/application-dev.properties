# =====================================================
# ProspectAI — Dev Profile (H2 in-memory database)
# =====================================================

# ── H2 Database ─────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:prospectai;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ── H2 Console (dev only) ──────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Logging ─────────────────────────────────────────
logging.level.com.prospectai=DEBUG

# ── Spring AI Keys ──────────────────────────────────
# Empty by default in dev so local fallback VectorStore & EmbeddingModel activate seamlessly
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
