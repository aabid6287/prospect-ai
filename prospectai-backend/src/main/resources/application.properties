# =====================================================
# ProspectAI — Development Configuration
# =====================================================
# Active profile: dev (uses H2 in-memory database)
# Switch to 'prod' profile for MySQL
# =====================================================

spring.application.name=ProspectAI

# ── Server ──────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ── Active Profile ──────────────────────────────────
spring.profiles.active=dev

# ── Multipart Upload ────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── JPA / Hibernate ────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Actuator ────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ── JWT ─────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ── Gemini API Key (via Spring AI) ──────────────────────────
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
# Chat Model
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# Embedding Model
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=text-embedding-004
spring.ai.google.genai.embedding.text.options.dimensions=1024

# ── Spring AI Model Selectors (Text & Embeddings only) ──
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none

# ── Pinecone (via Spring AI) ────────────────────────
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=${PINECONE_INDEX_NAME}
spring.ai.vectorstore.pinecone.namespace=${PINECONE_NAMESPACE}

# ── ProspectAI Ingestion Settings ───────────────────
app.ingestion.chunk-size=1000
app.ingestion.chunk-overlap=200
app.ingestion.max-file-size-mb=50
app.ingestion.allowed-content-types=application/pdf

# ── CORS ────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173

# ── Logging ─────────────────────────────────────────
logging.level.com.prospectai=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.ai=INFO
# Include correlationId from MDC in every log line
logging.pattern.level=%5p [%X{correlationId:-no-correlation-id}]

# ── Rate Limiting ────────────────────────────────────
# Applied to /api/chat/** and /api/analysis/**
app.rate-limit.max-requests=60
app.rate-limit.window-seconds=60
